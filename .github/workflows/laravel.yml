name: laravel

on:
  push:
    branches: [ staging ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v2
      with:
        fetch-depth: 1

    - name: FTP Deploy
      uses: SamKirkland/FTP-Deploy-Action@v4.3.4
      with:
        server: ${{ secrets.FTP_STAGING_SERVER }}
        username: ${{ secrets.FTP_STAGING_USERNAME }}
        password: ${{ secrets.FTP_STAGING_PASSWORD }}
        protocol: ftp
        server-dir: backendAdmin/
        local-dir: ./
        exclude: |
          .*/**
          **/.git*
          **/public/storage*

    - name: ssh actions (update packages)
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.FTP_STAGING_SERVER }}
        username: root
        password: ${{ secrets.FTP_STAGING_PASSWORD }}
        script: |
          cd public_html/backendAdmin/
          rm -f composer.lock
          composer clear-cache
          composer install --ignore-platform-reqs --no-interaction
          composer dump-autoload -o --ignore-platform-reqs
          rm -f local_ssh_script*
